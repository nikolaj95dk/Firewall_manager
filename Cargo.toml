[package]
name = "firewall-manager"
version = "1.0.2"
edition = "2021"
description = "A clean overview and cleanup tool for Windows Firewall rules"
build = "build.rs"

[lib]
name = "firewall_manager"
path = "src/lib.rs"

[[bin]]
name = "FirewallManager"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
egui_extras = "0.33.3"
egui-phosphor = "0.11"
rfd = "0.15"
winreg = "0.55"
raw-window-handle = "0.6"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_SystemInformation",
    "Win32_System_Variant",
    "Win32_UI_Shell",
] }

[build-dependencies]
winresource = "0.1"
ico = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
